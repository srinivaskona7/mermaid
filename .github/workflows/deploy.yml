name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mermaid Studio is a static site (no build step). We publish the repo
      # contents directly. .nojekyll stops GitHub Pages from running Jekyll,
      # which would otherwise ignore files/folders and mangle the app.
      - name: Ensure .nojekyll
        run: touch ./.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Whole repo root — all asset paths in the app are relative,
          # so it works under a project subpath (user.github.io/<repo>/).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
