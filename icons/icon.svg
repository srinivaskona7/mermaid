<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <!-- soft top-light sheen -->
  <path d="M0 118C0 52 52 0 118 0h276c66 0 118 52 118 118v40H0z" fill="#ffffff" opacity=".10"/>

  <!-- edges: the "M" as a graph of connected nodes -->
  <path d="M128 360V190L192 272L256 190L320 272L384 190V360"
        fill="none" stroke="#ffffff" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>

  <!-- nodes -->
  <g stroke="#0f766e" stroke-width="0">
    <circle cx="128" cy="190" r="30" fill="#ffffff"/>
    <circle cx="128" cy="190" r="13" fill="url(#node)"/>
    <circle cx="256" cy="190" r="34" fill="#ffffff"/>
    <circle cx="256" cy="190" r="15" fill="url(#node)"/>
    <circle cx="384" cy="190" r="30" fill="#ffffff"/>
    <circle cx="384" cy="190" r="13" fill="url(#node)"/>
    <circle cx="192" cy="272" r="22" fill="#ffffff"/>
    <circle cx="320" cy="272" r="22" fill="#ffffff"/>
    <circle cx="128" cy="360" r="22" fill="#ffffff"/>
    <circle cx="384" cy="360" r="22" fill="#ffffff"/>
  </g>
</svg>
